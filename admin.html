<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem 1rem;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;
        }

        h1 { font-size: 1.8rem; font-weight: 700; }

        .back-btn {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            padding: 0.5rem 1rem; border-radius: 6px; color: var(--text-primary);
            text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.2s;
        }
        .back-btn:hover { background-color: var(--border-color); }

        .chart-container {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow);
        }

        .chart-container h2 {
            font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-primary);
        }

        .chart-box {
            position: relative; height: 350px; width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>管理者アクセス解析</h1>
        <a href="index.html" class="back-btn">← メインサイトへ戻る</a>
    </header>

    <!-- グラフ1: 7日間の総サイト閲覧数 -->
    <div class="chart-container">
        <h2>📊 直近7日間の総サイト閲覧数（PV）</h2>
        <div class="chart-box">
            <canvas id="viewsChart"></canvas>
        </div>
    </div>

    <!-- グラフ2: 7日間の各サイトに飛んだ回数 -->
    <div class="chart-container">
        <h2>🔗 直近7日間の各サイト移行数（クリック数）</h2>
        <div class="chart-box">
            <canvas id="clicksChart"></canvas>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ▼▼▼ Firebaseの設定情報を貼り付けてください ▼▼▼
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    // ▲▲▲ ここまで ▲▲▲

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 直近7日間の日付ラベル（MM/DD形式）と判定用フォーマット（YYYY-MM-DD）の生成
    function getLast7Days() {
        const dates = [];
        const labels = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            
            dates.push(`${year}-${month}-${day}`);
            labels.push(`${d.getMonth() + 1}/${d.getDate()}`);
        }
        return { dates, labels };
    }

    // サイトごとのグラフ描画用カラー（固定色セット）
    const colorPalette = [
        '#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
        '#ec4899', '#14b8a6', '#f97316', '#06b6d4', '#84cc16', '#6366f1'
    ];

    async function loadAnalytics() {
        const { dates, labels } = getLast7Days();

        // 1. 閲覧数 (PV) データの集計
        const viewsSnapshot = await get(ref(db, 'page_views'));
        const viewsData = new Array(7).fill(0);

        if (viewsSnapshot.exists()) {
            const views = viewsSnapshot.val();
            Object.values(views).forEach(item => {
                if (item.time) {
                    const itemDate = item.time.split('T')[0];
                    const index = dates.indexOf(itemDate);
                    if (index !== -1) {
                        viewsData[index]++;
                    }
                }
            });
        }

        // 2. 各サイトのクリック数データの集計
        const clicksSnapshot = await get(ref(db, 'clicks'));
        const clicksBySite = {}; // { サイト名: [日ごとのカウント(7個)] }

        if (clicksSnapshot.exists()) {
            const clicks = clicksSnapshot.val();
            Object.values(clicks).forEach(item => {
                if (item.time && item.site) {
                    const itemDate = item.time.split('T')[0];
                    const index = dates.indexOf(itemDate);
                    if (index !== -1) {
                        if (!clicksBySite[item.site]) {
                            clicksBySite[item.site] = new Array(7).fill(0);
                        }
                        clicksBySite[item.site][index]++;
                    }
                }
            });
        }

        // --- グラフ1: 7日間の総閲覧数 (PV) ---
        new Chart(document.getElementById('viewsChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '総閲覧数 (PV)',
                    data: viewsData,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    fill: true,
                    tension: 0.3,
                    borderWidth: 2.5,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                }
            }
        });

        // --- グラフ2: 7日間の各サイトクリック数 ---
        const clickDatasets = Object.keys(clicksBySite).map((siteName, idx) => ({
            label: siteName,
            data: clicksBySite[siteName],
            borderColor: colorPalette[idx % colorPalette.length],
            backgroundColor: colorPalette[idx % colorPalette.length],
            fill: false,
            tension: 0.3,
            borderWidth: 2,
            pointRadius: 4
        }));

        new Chart(document.getElementById('clicksChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: clickDatasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                },
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }

    loadAnalytics();
</script>

</body>
</html>
