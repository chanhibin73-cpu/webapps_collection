<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード</title>
    <!-- Chart.js 読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* --- パスワード保護モーダル --- */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; justify-content: center; align-items: center; padding: 1rem;
        }

        .auth-box {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 2rem; max-width: 400px; width: 100%;
            box-shadow: var(--shadow); text-align: center;
        }

        .auth-box h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
        .auth-box p { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1.5rem; }

        .auth-input {
            width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; outline: none;
        }

        .auth-btn {
            width: 100%; padding: 0.75rem; background-color: var(--accent-color);
            color: #ffffff; border: none; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: opacity 0.2s ease;
        }
        .auth-btn:hover { opacity: 0.9; }

        .auth-error {
            color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; display: none;
        }

        /* --- 管理画面メインコンテンツ --- */
        #admin-content { display: none; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 1.8rem; font-weight: 700; }

        .back-btn {
            background-color: var(--card-bg); color: var(--text-primary);
            border: 1px solid var(--border-color); padding: 0.5rem 1rem;
            border-radius: 6px; text-decoration: none; font-size: 0.9rem;
            font-weight: 600; transition: all 0.2s ease;
        }
        .back-btn:hover { background-color: #f1f5f9; }

        /* --- 数値カードエリア --- */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem; margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow);
        }

        .stat-label { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--accent-color); }

        .site-list-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow);
        }
        .site-list-card h2 { font-size: 1.2rem; margin-bottom: 1rem; }
        
        .click-list { list-style: none; }
        .click-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 0; border-bottom: 1px solid var(--border-color);
        }
        .click-item:last-child { border-bottom: none; }
        .site-name { font-weight: 600; }
        .site-count { font-weight: 700; color: var(--accent-color); }

        /* --- グラフ表示エリア --- */
        .chart-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }
        .chart-card h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-primary); }
        .chart-container { position: relative; width: 100%; height: 350px; }

        @media (max-width: 640px) {
            .chart-container { height: 250px; }
        }
    </style>
</head>
<body>

<!-- パスワード認証画面 -->
<div class="auth-overlay" id="authModal">
    <div class="auth-box">
        <h2>管理者ログイン</h2>
        <p>管理者パスワードを入力してください</p>
        <form id="authForm">
            <input type="password" id="passInput" class="auth-input" placeholder="パスワード" required>
            <button type="submit" class="auth-btn">ログイン</button>
        </form>
        <div class="auth-error" id="authError">パスワードが間違っています。</div>
    </div>
</div>

<!-- 管理画面ダッシュボード -->
<div class="container" id="admin-content">
    <header>
        <h1>管理者アナリティクス</h1>
        <a href="index.html" class="back-btn">← ポータルへ戻る</a>
    </header>

    <!-- 1. 本日の総アクセス数カード -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">本日の総サイト閲覧数 (PV)</div>
            <div class="stat-value" id="today-pv">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">本日の総サイトクリック数</div>
            <div class="stat-value" id="today-clicks">0</div>
        </div>
    </div>

    <!-- 2. 本日の各サイトへのアクセス数（リスト表示） -->
    <div class="site-list-card">
        <h2>本日の各サイトアクセス数</h2>
        <ul class="click-list" id="site-click-list">
            <li class="click-item"><span class="site-name">データ読み込み中...</span></li>
        </ul>
    </div>

    <!-- 3. 7日間の総サイト閲覧数 折れ線グラフ -->
    <div class="chart-card">
        <h2>過去7日間の総サイト閲覧数 (PV)</h2>
        <div class="chart-container">
            <canvas id="viewsChart"></canvas>
        </div>
    </div>

    <!-- 4. 7日間の各サイトに飛んだ回数 折れ線グラフ -->
    <div class="chart-card">
        <h2>過去7日間の各サイト遷移数 (クリック数)</h2>
        <div class="chart-container">
            <canvas id="clicksChart"></canvas>
        </div>
    </div>

    <!-- 5. 一番下：各サイトの累計総アクセス数 (全期間) -->
    <div class="site-list-card">
        <h2>各サイトの累計総アクセス数</h2>
        <ul class="click-list" id="total-site-click-list">
            <li class="click-item"><span class="site-name">データ読み込み中...</span></li>
        </ul>
    </div>
</div>

<!-- Firebase対応スクリプト -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ▼ 管理者用パスワード設定
    const ADMIN_PASSWORD = "HIBIYURI20250315";

    // ▼ Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAmfx5dTWws1-yR7K80p-bJS0STbsLnttE",
        authDomain: "webapps-collection.firebaseapp.com",
        databaseURL: "https://webapps-collection-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "webapps-collection",
        storageBucket: "webapps-collection.firebasestorage.app",
        messagingSenderId: "630369398063",
        appId: "1:630369398063:web:d41e12e46f2a632e7e45da"
    };

    // パスワード認証処理
    const authForm = document.getElementById('authForm');
    const authModal = document.getElementById('authModal');
    const adminContent = document.getElementById('admin-content');
    const authError = document.getElementById('authError');

    authForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const inputPass = document.getElementById('passInput').value;

        if (inputPass === ADMIN_PASSWORD) {
            authModal.style.display = 'none';
            adminContent.style.display = 'block';
            sessionStorage.setItem('admin_authenticated', 'true');
            initDashboard();
        } else {
            authError.style.display = 'block';
        }
    });

    // 既に認証済みの場合はそのまま表示
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
        authModal.style.display = 'none';
        adminContent.style.display = 'block';
        initDashboard();
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getLast7Days() {
        const dates = [];
        const fullDates = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            
            dates.push(`${d.getMonth() + 1}/${d.getDate()}`);
            fullDates.push(`${yyyy}-${mm}-${dd}`);
        }
        return { labels: dates, keys: fullDates };
    }

    const dayInfo = getLast7Days();
    const todayStr = dayInfo.keys[6];

    const colors = [
        '#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
        '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1', '#14b8a6'
    ];

    let viewsChartInstance = null;
    let clicksChartInstance = null;

    function updateDashboard(viewsData, clicksData) {
        // --- 1. 本日の総アクセス数＆7日間のPV集計 ---
        let todayPvCount = 0;
        const dailyViews = new Array(7).fill(0);

        if (viewsData) {
            Object.values(viewsData).forEach(item => {
                if (item && item.time) {
                    const dateStr = item.time.split('T')[0];
                    if (dateStr === todayStr) todayPvCount++;
                    
                    const index = dayInfo.keys.indexOf(dateStr);
                    if (index !== -1) dailyViews[index]++;
                }
            });
        }
        document.getElementById('today-pv').textContent = todayPvCount;

        // --- 2. 本日の各サイトアクセス数＆7日間のクリック集計＆累計総アクセス数 ---
        let todayClickCount = 0;
        const todaySiteClicks = {};
        const siteClickCounts = {};
        const totalSiteClicks = {}; // 全期間のサイト別クリック数

        if (clicksData) {
            Object.values(clicksData).forEach(item => {
                if (item && item.site) {
                    // 全期間の累計数を集計
                    totalSiteClicks[item.site] = (totalSiteClicks[item.site] || 0) + 1;
                }

                if (item && item.time && item.site) {
                    const dateStr = item.time.split('T')[0];
                    
                    if (dateStr === todayStr) {
                        todayClickCount++;
                        todaySiteClicks[item.site] = (todaySiteClicks[item.site] || 0) + 1;
                    }

                    const index = dayInfo.keys.indexOf(dateStr);
                    if (index !== -1) {
                        if (!siteClickCounts[item.site]) {
                            siteClickCounts[item.site] = new Array(7).fill(0);
                        }
                        siteClickCounts[item.site][index]++;
                    }
                }
            });
        }
        document.getElementById('today-clicks').textContent = todayClickCount;

        // 本日のアクセス数リスト
        const listEl = document.getElementById('site-click-list');
        listEl.innerHTML = '';
        if (Object.keys(todaySiteClicks).length === 0) {
            listEl.innerHTML = '<li class="click-item"><span class="site-name">本日のアクセスデータはまだありません</span></li>';
        } else {
            Object.entries(todaySiteClicks).sort((a, b) => b[1] - a[1]).forEach(([site, count]) => {
                const li = document.createElement('li');
                li.className = 'click-item';
                li.innerHTML = `<span class="site-name">${site}</span><span class="site-count">${count} 回</span>`;
                listEl.appendChild(li);
            });
        }

        // 一番下：各サイトの累計総アクセス数リスト
        const totalListEl = document.getElementById('total-site-click-list');
        if (totalListEl) {
            totalListEl.innerHTML = '';
            if (Object.keys(totalSiteClicks).length === 0) {
                totalListEl.innerHTML = '<li class="click-item"><span class="site-name">累計アクセスデータはまだありません</span></li>';
            } else {
                Object.entries(totalSiteClicks).sort((a, b) => b[1] - a[1]).forEach(([site, count]) => {
                    const li = document.createElement('li');
                    li.className = 'click-item';
                    li.innerHTML = `<span class="site-name">${site}</span><span class="site-count">${count} 回</span>`;
                    totalListEl.appendChild(li);
                });
            }
        }

        // --- 3. 折れ線グラフ描画：総PV ---
        const ctxViews = document.getElementById('viewsChart').getContext('2d');
        if (viewsChartInstance) viewsChartInstance.destroy();
        viewsChartInstance = new Chart(ctxViews, {
            type: 'line',
            data: {
                labels: dayInfo.labels,
                datasets: [{
                    label: '総閲覧数 (PV)',
                    data: dailyViews,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });

        // --- 4. 折れ線グラフ描画：各サイトアクセス数 ---
        const clickDatasets = [];
        let colorIdx = 0;
        Object.keys(siteClickCounts).forEach(siteName => {
            clickDatasets.push({
                label: siteName,
                data: siteClickCounts[siteName],
                borderColor: colors[colorIdx % colors.length],
                backgroundColor: colors[colorIdx % colors.length],
                borderWidth: 2,
                fill: false,
                tension: 0.3,
                pointRadius: 4
            });
            colorIdx++;
        });

        const ctxClicks = document.getElementById('clicksChart').getContext('2d');
        if (clicksChartInstance) clicksChartInstance.destroy();
        clicksChartInstance = new Chart(ctxClicks, {
            type: 'line',
            data: {
                labels: dayInfo.labels,
                datasets: clickDatasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                plugins: { legend: { position: 'bottom' } }
            }
        });
    }

    let viewsCache = null;
    let clicksCache = null;

    function initDashboard() {
        // データがまだ作成されていない(null)場合も安全に空データ({})を渡して描画を実行する処理
        onValue(ref(db, 'page_views'), (snapshot) => {
            viewsCache = snapshot.val() || {};
            updateDashboard(viewsCache, clicksCache);
        }, (error) => {
            console.error("PV取得エラー:", error);
        });

        onValue(ref(db, 'clicks'), (snapshot) => {
            clicksCache = snapshot.val() || {};
            updateDashboard(viewsCache, clicksCache);
        }, (error) => {
            console.error("クリックデータ取得エラー:", error);
        });
    }
</script>

</body>
</html>
