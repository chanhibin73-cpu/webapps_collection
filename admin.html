<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード - Web Apps Collection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .chart-card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-primary);
            text-align: center;
        }
        .back-btn {
            display: block;
            width: fit-content;
            margin: 0 auto 2rem auto;
            padding: 0.6rem 1.5rem;
            background-color: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>

    <h1>管理者ダッシュボード</h1>
    <a href="index.html" class="back-btn">サイトに戻る</a>

    <div class="dashboard-grid">
        <!-- 既存のグラフ（想定） -->
        <div class="chart-card">
            <h2>サイト別クリック数（累計）</h2>
            <canvas id="clicksChart"></canvas>
        </div>
        <div class="chart-card">
            <h2>日別サイト閲覧数（直近7日間）</h2>
            <canvas id="dailyViewsChart"></canvas>
        </div>
        
        <!-- 新規追加のグラフ -->
        <div class="chart-card">
            <h2>今日の1時間ごとのサイト閲覧数</h2>
            <canvas id="hourlyViewsChart"></canvas>
        </div>
        <div class="chart-card">
            <h2>今日の1時間ごとの別サイト移動数（クリック数）</h2>
            <canvas id="hourlyClicksChart"></canvas>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Firebaseの設定（index.htmlと同じ）
        const firebaseConfig = {
            apiKey: "AIzaSyAmfx5dTWws1-yR7K80p-bJS0STbsLnttE",
            authDomain: "webapps-collection.firebaseapp.com",
            databaseURL: "https://webapps-collection-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "webapps-collection",
            storageBucket: "webapps-collection.firebasestorage.app",
            messagingSenderId: "630369398063",
            appId: "1:630369398063:web:d41e12e46f2a632e7e45da"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // グラフ用の変数を準備
        let clicksChartInstance = null;
        let dailyViewsChartInstance = null;
        let hourlyViewsChartInstance = null;
        let hourlyClicksChartInstance = null;

        async function fetchAndRenderData() {
            try {
                const clicksSnapshot = await get(ref(db, 'clicks'));
                const viewsSnapshot = await get(ref(db, 'page_views'));

                const clicksData = clicksSnapshot.val() || {};
                const viewsData = viewsSnapshot.val() || {};

                processAndRenderCharts(clicksData, viewsData);
            } catch (error) {
                console.error("データ取得エラー:", error);
            }
        }

        function processAndRenderCharts(clicksData, viewsData) {
            const today = new Date();
            const todayString = today.toLocaleDateString('ja-JP');

            // --- データ集計用のオブジェクト・配列 ---
            const siteClickCounts = {};
            const dailyViewCounts = {};
            
            // 新規追加：1時間ごとの配列（0時〜23時まで24個の0を入れる）
            const hourlyViews = new Array(24).fill(0);
            const hourlyClicks = new Array(24).fill(0);

            // 1. クリック数の集計（サイト別 ＆ 今日の1時間ごと）
            Object.values(clicksData).forEach(item => {
                // サイト別の累計
                if (item.site) {
                    siteClickCounts[item.site] = (siteClickCounts[item.site] || 0) + 1;
                }
                
                // 今日の1時間ごとの集計
                if (item.time) {
                    const dateObj = new Date(item.time);
                    if (dateObj.toLocaleDateString('ja-JP') === todayString) {
                        hourlyClicks[dateObj.getHours()]++;
                    }
                }
            });

            // 2. 閲覧数の集計（日別 ＆ 今日の1時間ごと）
            Object.values(viewsData).forEach(item => {
                const timestamp = item.timestamp || (item.time ? new Date(item.time).getTime() : Date.now());
                const dateObj = new Date(timestamp);
                const dateString = dateObj.toLocaleDateString('ja-JP');

                // 日別の累計
                dailyViewCounts[dateString] = (dailyViewCounts[dateString] || 0) + 1;

                // 今日の1時間ごとの集計
                if (dateString === todayString) {
                    hourlyViews[dateObj.getHours()]++;
                }
            });

            // --- グラフの描画 ---
            renderClicksChart(siteClickCounts);
            renderDailyViewsChart(dailyViewCounts);
            renderHourlyViewsChart(hourlyViews);
            renderHourlyClicksChart(hourlyClicks);
        }

        function renderClicksChart(data) {
            const ctx = document.getElementById('clicksChart').getContext('2d');
            if (clicksChartInstance) clicksChartInstance.destroy();
            clicksChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(data),
                    datasets: [{
                        label: 'クリック数',
                        data: Object.values(data),
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function renderDailyViewsChart(data) {
            const ctx = document.getElementById('dailyViewsChart').getContext('2d');
            
            // 直近7日間のラベルを作成
            const labels = [];
            const values = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toLocaleDateString('ja-JP');
                labels.push(dateStr);
                values.push(data[dateStr] || 0);
            }

            if (dailyViewsChartInstance) dailyViewsChartInstance.destroy();
            dailyViewsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '閲覧数',
                        data: values,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        // 新規追加：1時間ごとのサイト閲覧数
        function renderHourlyViewsChart(hourlyData) {
            const ctx = document.getElementById('hourlyViewsChart').getContext('2d');
            const labels = Array.from({length: 24}, (_, i) => `${i}時`);

            if (hourlyViewsChartInstance) hourlyViewsChartInstance.destroy();
            hourlyViewsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '閲覧数',
                        data: hourlyData,
                        backgroundColor: 'rgba(255, 159, 64, 0.2)',
                        borderColor: 'rgba(255, 159, 64, 1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        // 新規追加：1時間ごとのクリック数（移動数）
        function renderHourlyClicksChart(hourlyData) {
            const ctx = document.getElementById('hourlyClicksChart').getContext('2d');
            const labels = Array.from({length: 24}, (_, i) => `${i}時`);

            if (hourlyClicksChartInstance) hourlyClicksChartInstance.destroy();
            hourlyClicksChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '移動数',
                        data: hourlyData,
                        backgroundColor: 'rgba(153, 102, 255, 0.6)',
                        borderColor: 'rgba(153, 102, 255, 1)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        // 初期データの読み込みを実行
        fetchAndRenderData();
    </script>
</body>
</html>
