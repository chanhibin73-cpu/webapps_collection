<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード</title>
    <!-- Chart.js 読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;
        }

        h1 { font-size: 1.8rem; font-weight: 700; }

        .back-btn {
            padding: 0.5rem 1rem; background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-primary); text-decoration: none; font-size: 0.9rem;
            font-weight: 600; transition: background-color 0.2s;
        }
        .back-btn:hover { background-color: var(--border-color); }

        .dashboard-grid {
            display: grid; grid-template-columns: 1fr; gap: 2rem; margin-bottom: 2rem;
        }

        .chart-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow);
        }

        .chart-card h2 {
            font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-primary);
            display: flex; align-items: center; gap: 0.5rem;
        }

        .chart-container {
            position: relative; height: 350px; width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📊 管理者アナリティクス</h1>
        <a href="index.html" class="back-btn">← ポータルへ戻る</a>
    </header>

    <div class="dashboard-grid">
        <!-- 1. 直近7日間の総サイト閲覧数（PV） -->
        <div class="chart-card">
            <h2>📈 直近7日間の総サイト閲覧数（PV）</h2>
            <div class="chart-container">
                <canvas id="pvChart"></canvas>
            </div>
        </div>

        <!-- 2. 直近7日間の各サイトへの移動回数（クリック数） -->
        <div class="chart-card">
            <h2>🔗 直近7日間の各サイト移動回数</h2>
            <div class="chart-container">
                <canvas id="clickChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ▼▼▼ Firebaseの設定情報を貼り付けてください ▼▼▼
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    // ▲▲▲ ここまで ▲▲▲

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 直近7日間の日付配列（YYYY-MM-DD）を作成
    function getLast7Days() {
        const dates = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            dates.push(d.toISOString().split('T')[0]);
        }
        return dates;
    }

    // グラフ描画用カラーパレット（各サイト識別用）
    const colors = [
        '#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
        '#ec4899', '#06b6d4', '#84cc16', '#6366f1', '#14b8a6', '#f97316'
    ];

    async function loadAnalytics() {
        const dates = getLast7Days();

        // Data Fetching
        const pvSnap = await get(ref(db, 'page_views'));
        const clickSnap = await get(ref(db, 'clicks'));

        const pvData = pvSnap.exists() ? pvSnap.val() : {};
        const clickData = clickSnap.exists() ? clickSnap.val() : {};

        // --- 1. PVデータ集計 ---
        const pvCounts = dates.map(date => {
            return Object.values(pvData).filter(item => item.time && item.time.startsWith(date)).length;
        });

        // PVグラフ描画
        const ctxPV = document.getElementById('pvChart').getContext('2d');
        new Chart(ctxPV, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [{
                    label: '総閲覧数 (PV)',
                    data: pvCounts,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    fill: true,
                    tension: 0.3,
                    borderWidth: 2,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });

        // --- 2. 各サイトのクリック数集計 ---
        const siteNames = [...new Set(Object.values(clickData).map(item => item.site))].filter(Boolean);
        
        const clickDatasets = siteNames.map((site, index) => {
            const siteCounts = dates.map(date => {
                return Object.values(clickData).filter(item => item.site === site && item.time && item.time.startsWith(date)).length;
            });

            return {
                label: site,
                data: siteCounts,
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length],
                fill: false,
                tension: 0.3,
                borderWidth: 2,
                pointRadius: 3
            };
        });

        // クリック数グラフ描画
        const ctxClick = document.getElementById('clickChart').getContext('2d');
        new Chart(ctxClick, {
            type: 'line',
            data: {
                labels: dates,
                datasets: clickDatasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { boxWidth: 12, font: { size: 11 } }
                    }
                }
            }
        });
    }

    loadAnalytics();
</script>

</body>
</html>
